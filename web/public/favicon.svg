<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3245" />
      <stop offset="100%" stop-color="#1a1f2e" />
    </linearGradient>

    <!-- Accent Gradient (Orange) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e87a45" />
      <stop offset="100%" stop-color="#c45c26" />
    </linearGradient>

    <!-- Inner Glow/Shadow for Glassmorphism -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="-2" stdDeviation="5" flood-color="#ffffff" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- The Document Base (Glass panel) -->
  <path d="M160 100 h120 l80 80 v232 a24 24 0 0 1 -24 24 H160 a24 24 0 0 1 -24 -24 V124 a24 24 0 0 1 24 -24 Z" 
        fill="#ffffff" fill-opacity="0.05" 
        stroke="url(#accentGrad)" stroke-width="8" 
        stroke-opacity="0.8" 
        filter="url(#glass)"/>
  
  <!-- Folded corner of document -->
  <path d="M280 100 v80 h80" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Magnifying Glass (Lens) -->
  <circle cx="256" cy="280" r="70" 
          fill="url(#accentGrad)" fill-opacity="0.1" 
          stroke="url(#accentGrad)" stroke-width="24"/>
  
  <!-- Magnifying Glass (Handle) -->
  <line x1="305" y1="330" x2="380" y2="405" 
        stroke="url(#accentGrad)" stroke-width="32" 
        stroke-linecap="round"/>

  <!-- Data flow lines inside lens -->
  <line x1="216" y1="260" x2="280" y2="260" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="216" y1="295" x2="296" y2="295" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.9"/>
</svg>